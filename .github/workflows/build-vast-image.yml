name: Build vast.ai llama.cpp image

# Manual only: this image changes rarely (only when the CUDA/llama.cpp setup
# in Dockerfile.vast-llama changes), so it isn't built on every push.
on:
  workflow_dispatch: {}

jobs:
  build-and-push:
    # ubuntu-latest is a native x86_64 runner, matching vast.ai hosts --
    # no QEMU emulation needed for this linux/amd64-only build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vast-llama
          platforms: linux/amd64
          push: true
          tags: andreasatle/forge-vast-llama:latest
